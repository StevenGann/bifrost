<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Bifrost">
  <title>Bifrost</title>
  <defs>
    <!-- The span is the rainbow. Colour runs along the arch, left to right, so
         the gradient does structural work instead of decorating a shape. -->
    <linearGradient id="bifrost-rainbow" x1="8" y1="42" x2="56" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset=".5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Deck: full bleed, so the crossing continues past the frame instead of
       being a bar that sits under a shape. -->
  <rect x="0" y="42" width="64" height="7" fill="#5c6c81"/>
  <!-- Span: wide and low, heavy at the feet and thinner at the crown the way a
       loaded arch is. The feet run down to y=46, inside the deck, so they read
       as abutments rather than resting on a line. -->
  <path d="M8 46V42Q32 10 56 42v4H45Q32 20 19 46z" fill="url(#bifrost-rainbow)"/>
</svg>
